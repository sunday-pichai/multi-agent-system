<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1318"/>
      <stop offset="100%" stop-color="#1d2630"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2d3a45" stroke-width="2"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.3"/>

  <!-- Title Section (Left Side) - Moved Left -->
  <g transform="translate(60, 300)">
    <text x="0" y="-20" fill="#ffffff" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="64" letter-spacing="-1">WAREHOUSE</text>
    <text x="0" y="50" fill="#4fc3f7" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="64" letter-spacing="-1">MULTI-AGENT</text>
    <text x="0" y="120" fill="#ffffff" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="64" letter-spacing="-1">SYSTEM</text>
    
    <line x1="0" y1="160" x2="100" y2="160" stroke="#ffd166" stroke-width="8"/>
  </g>

  <!-- Pathfinding Scene (Right Side) - Moved Right & Scaled Down slightly -->
  <g transform="translate(780, 315) scale(0.9)">
     <!-- Shelf Blocks (Obstacles) -->
     <g fill="#1f2a33" stroke="#4fc3f7" stroke-width="2" stroke-opacity="0.3">
        <!-- Top Block -->
        <rect x="-100" y="-140" width="200" height="80" rx="8"/>
        <!-- Bottom Block -->
        <rect x="-100" y="60" width="200" height="80" rx="8"/>
     </g>

     <!-- Agent 1 Path (Blue): Bottom Left -> Top Right -->
     <path d="M -240 100 L -140 100 L -140 0 L 140 0 L 140 -100 L 240 -100" 
           fill="none" stroke="#4fc3f7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" stroke-dasharray="12 12"/>

     <!-- Agent 2 Path (Orange): Top Left -> Bottom Right -->
     <path d="M -240 -100 L -180 -100 L -180 40 L 180 40 L 180 140 L 240 140" 
           fill="none" stroke="#ffd166" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" stroke-dasharray="12 12"/>

     <!-- Agents with Glow -->
     <circle cx="0" cy="0" r="16" fill="#4fc3f7" filter="url(#glow)"/> <!-- Agent 1 mid-move -->
     <circle cx="0" cy="40" r="16" fill="#ffd166" filter="url(#glow)"/> <!-- Agent 2 mid-move -->
     
     <!-- Start/Goals Agent 1 -->
     <circle cx="-240" cy="100" r="8" fill="none" stroke="#4fc3f7" stroke-width="3" opacity="0.5"/>
     <circle cx="240" cy="-100" r="8" fill="#4fc3f7" opacity="0.5"/>

     <!-- Start/Goals Agent 2 -->
     <circle cx="-240" cy="-100" r="8" fill="none" stroke="#ffd166" stroke-width="3" opacity="0.5"/>
     <circle cx="240" cy="140" r="8" fill="#ffd166" opacity="0.5"/>
  </g>
</svg>