<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1318"/>
      <stop offset="100%" stop-color="#18202a"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2d3a45" fill-opacity="0.5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Accents / Deco -->
  <path d="M0 0 L300 0 L150 150 Z" fill="#c85d3d" fill-opacity="0.1"/>
  <path d="M1200 630 L900 630 L1050 480 Z" fill="#ffd166" fill-opacity="0.05"/>
  
  <rect x="850" y="-50" width="400" height="400" rx="80" transform="rotate(20 1050 150)" stroke="#2d3a45" stroke-width="2" fill="none" opacity="0.3"/>

  <!-- Content Container -->
  <g transform="translate(600, 315)">
    <!-- Logo Abstract -->
    <g transform="translate(0, -60)">
        <rect x="-80" y="-80" width="160" height="160" rx="32" stroke="#c85d3d" stroke-width="8" fill="#1f2a33"/>
        <circle cx="0" cy="0" r="32" fill="#ffd166" filter="url(#glow)"/>
        <!-- Plan/Path lines -->
        <path d="M-80 0 H-40 M40 0 H80 M0 -80 V-40 M0 40 V80" stroke="#c85d3d" stroke-width="4"/>
    </g>

    <text y="100" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Warehouse MAS</text>
    <text y="160" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="400" fill="#8b949e" text-anchor="middle" letter-spacing="1">DETERMINISTIC • VERIFIED • OPTIMIZED</text>
  </g>
</svg>