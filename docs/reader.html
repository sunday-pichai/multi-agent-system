<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Documentation Reader</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --panel: #ffffff;
        --panel-soft: #f8fbff;
        --text: #0b1220;
        --muted: #4b5b74;
        --border: #d9e2ef;
        --accent: #1d4ed8;
        --code: #111827;
        --inline-code-bg: #eef3fb;
        --inline-code-border: #d7e2f1;
        --error-bg: #fef2f2;
        --error-border: #fecaca;
        --error-text: #b91c1c;
      }
      [data-theme="dark"] {
        --bg: #050b16;
        --panel: #0c1526;
        --panel-soft: #111d34;
        --text: #e8eefc;
        --muted: #9fb0cd;
        --border: #24324d;
        --accent: #60a5fa;
        --code: #030814;
        --inline-code-bg: #14223b;
        --inline-code-border: #2a3c62;
        --error-bg: #2a1016;
        --error-border: #7f1d2d;
        --error-text: #ffb0be;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .layout {
        display: grid;
        grid-template-columns: 300px 1fr;
        min-height: 100vh;
      }
      .sidebar {
        border-right: 1px solid var(--border);
        background: linear-gradient(180deg, var(--panel) 0%, var(--panel-soft) 100%);
        padding: 16px;
      }
      .sidebar h1 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      .sidebar-toggle {
        display: none;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 10px;
        width: 100%;
        text-align: left;
        margin-bottom: 10px;
        cursor: pointer;
      }
      .sidebar-links {
        display: block;
      }
      .sidebar a {
        display: block;
        padding: 8px 10px;
        color: var(--muted);
        text-decoration: none;
        border-radius: 8px;
        margin-bottom: 4px;
      }
      .sidebar a:hover,
      .sidebar a.active {
        background: rgba(96, 165, 250, 0.18);
        color: var(--accent);
      }
      .content-wrap {
        padding: 28px 32px;
      }
      .toolbar {
        margin-bottom: 14px;
        color: var(--muted);
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: var(--panel-soft);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
      }
      .toolbar a {
        color: var(--accent);
        text-decoration: none;
      }
      .toolbar-main {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .toolbar-main code {
        font-size: 0.9em;
      }
      .theme-btn {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        border-radius: 10px;
        width: 38px;
        height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex: 0 0 auto;
      }
      .theme-btn:hover {
        border-color: var(--accent);
      }
      .theme-btn svg {
        width: 19px;
        height: 19px;
      }
      .theme-btn .icon-moon { display: none; }
      [data-theme="dark"] .theme-btn .icon-sun { display: none; }
      [data-theme="dark"] .theme-btn .icon-moon { display: inline; }
      .doc-title-chip {
        display: inline-block;
        margin-top: 8px;
        margin-bottom: 12px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel-soft);
        color: var(--muted);
        font-size: 13px;
      }
      .content {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        line-height: 1.6;
      }
      .content h1, .content h2, .content h3 { line-height: 1.25; margin-top: 1.2em; }
      .content h1 { font-size: 30px; margin-top: 0; }
      .content h2 { font-size: 24px; }
      .content h3 { font-size: 20px; }
      .content p { margin: 0 0 12px; }
      .content ul, .content ol { margin: 0 0 12px 22px; }
      .content code {
        background: var(--inline-code-bg);
        border: 1px solid var(--inline-code-border);
        border-radius: 6px;
        padding: 0 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.92em;
      }
      .content pre {
        background: var(--code);
        color: #e5e7eb;
        border-radius: 10px;
        padding: 14px;
        overflow: auto;
      }
      .content pre code {
        background: none;
        border: 0;
        color: inherit;
        padding: 0;
      }
      .error {
        color: var(--error-text);
        background: var(--error-bg);
        border: 1px solid var(--error-border);
        padding: 12px;
        border-radius: 8px;
      }
      @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; }
        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--border);
          position: sticky;
          top: 0;
          z-index: 30;
          padding: 12px;
        }
        .sidebar h1 {
          margin: 0 0 8px;
          font-size: 16px;
        }
        .sidebar-toggle { display: block; }
        .sidebar-links { display: none; max-height: 48vh; overflow: auto; padding-right: 4px; }
        .sidebar.is-open .sidebar-links { display: block; }
        .sidebar a { padding: 10px 10px; font-size: 16px; }
        .content-wrap { padding: 12px; }
        .toolbar {
          gap: 10px;
          font-size: 13px;
          padding: 10px;
        }
        .toolbar-main {
          width: calc(100% - 48px);
        }
        .theme-btn { width: 38px; height: 38px; }
        .content { padding: 14px; border-radius: 10px; }
        .content h1 { font-size: 24px; }
        .content h2 { font-size: 20px; }
        .content h3 { font-size: 18px; }
        .content p, .content li { font-size: 15px; }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h1>Documentation</h1>
        <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-expanded="false">Chapters</button>
        <div id="sidebarLinks" class="sidebar-links">
          <a href="reader.html?doc=pdf/01_overview_architecture.md">01 Overview & Architecture</a>
          <a href="reader.html?doc=pdf/02_symmetry_reduction_verification.md">02 Symmetry & Verification</a>
          <a href="reader.html?doc=pdf/03_pathfinding_planner.md">03 Pathfinding Planner</a>
          <a href="reader.html?doc=pdf/04_env_dynamics.md">04 Environment Dynamics</a>
          <a href="reader.html?doc=pdf/05_agent_semantics.md">05 Agent Semantics</a>
          <a href="reader.html?doc=pdf/06_main_orchestration_cli.md">06 Main & CLI</a>
          <a href="reader.html?doc=pdf/07_config_and_parameters.md">07 Config</a>
          <a href="reader.html?doc=pdf/08_refinement_and_constraint_injection.md">08 Refinement</a>
          <a href="reader.html?doc=pdf/09_detailed_workflows_and_execution_playbook.md">09 Workflow Playbook</a>
        </div>
      </aside>
      <main class="content-wrap">
        <div class="toolbar" id="toolbar"></div>
        <article class="content" id="content">Loading...</article>
      </main>
    </div>
    <script src="reader_docs.js"></script>
    <script>
      function escapeHtml(text) {
        return text
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function inlineFormat(text) {
        let out = escapeHtml(text);
        out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
        out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
        return out;
      }

      function renderMarkdown(md) {
        const lines = md.replace(/\r/g, "").split("\n");
        const html = [];
        let inCode = false;
        let inUl = false;
        let inOl = false;

        function closeLists() {
          if (inUl) { html.push("</ul>"); inUl = false; }
          if (inOl) { html.push("</ol>"); inOl = false; }
        }

        for (const raw of lines) {
          const line = raw.trimEnd();
          if (line.startsWith("```")) {
            closeLists();
            if (!inCode) {
              inCode = true;
              html.push("<pre><code>");
            } else {
              inCode = false;
              html.push("</code></pre>");
            }
            continue;
          }
          if (inCode) {
            html.push(escapeHtml(raw) + "\n");
            continue;
          }
          if (!line) {
            closeLists();
            continue;
          }

          if (line.startsWith("# ")) { closeLists(); html.push("<h1>" + inlineFormat(line.slice(2)) + "</h1>"); continue; }
          if (line.startsWith("## ")) { closeLists(); html.push("<h2>" + inlineFormat(line.slice(3)) + "</h2>"); continue; }
          if (line.startsWith("### ")) { closeLists(); html.push("<h3>" + inlineFormat(line.slice(4)) + "</h3>"); continue; }

          const olMatch = line.match(/^\d+\.\s+(.*)$/);
          if (olMatch) {
            if (inUl) { html.push("</ul>"); inUl = false; }
            if (!inOl) { html.push("<ol>"); inOl = true; }
            html.push("<li>" + inlineFormat(olMatch[1]) + "</li>");
            continue;
          }

          if (line.startsWith("- ")) {
            if (inOl) { html.push("</ol>"); inOl = false; }
            if (!inUl) { html.push("<ul>"); inUl = true; }
            html.push("<li>" + inlineFormat(line.slice(2)) + "</li>");
            continue;
          }

          closeLists();
          html.push("<p>" + inlineFormat(line) + "</p>");
        }
        closeLists();
        if (inCode) html.push("</code></pre>");
        return html.join("");
      }

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("docs_theme", theme);
        const t = document.getElementById("themeToggle");
        if (t) t.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
      }

      function initTheme() {
        const saved = localStorage.getItem("docs_theme");
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        applyTheme(saved || (prefersDark ? "dark" : "light"));
      }

      function initMobileSidebar() {
        const sidebar = document.querySelector(".sidebar");
        const toggle = document.getElementById("sidebarToggle");
        if (!sidebar || !toggle) return;
        toggle.addEventListener("click", () => {
          const open = sidebar.classList.toggle("is-open");
          toggle.setAttribute("aria-expanded", open ? "true" : "false");
        });
        document.querySelectorAll(".sidebar a").forEach((a) => {
          a.addEventListener("click", () => {
            if (window.innerWidth <= 900) {
              sidebar.classList.remove("is-open");
              toggle.setAttribute("aria-expanded", "false");
            }
          });
        });
      }

      async function loadDoc() {
        const params = new URLSearchParams(window.location.search);
        const doc = params.get("doc") || "pdf/01_overview_architecture.md";
        const content = document.getElementById("content");
        const toolbar = document.getElementById("toolbar");
        toolbar.innerHTML = "<div class=\"toolbar-main\">Viewing: <code>" + doc + "</code> • <a href=\"" + encodeURI(doc) + "\" target=\"_blank\" rel=\"noopener noreferrer\">Open Raw</a></div><button id=\"themeToggle\" class=\"theme-btn\" type=\"button\" aria-label=\"Toggle theme\"><svg class=\"icon-sun\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"4\"></circle><path d=\"M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41\"></path></svg><svg class=\"icon-moon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z\"></path></svg></button>";
        const themeToggle = document.getElementById("themeToggle");
        if (themeToggle) {
          themeToggle.addEventListener("click", () => {
            const current = document.documentElement.getAttribute("data-theme") || "light";
            applyTheme(current === "dark" ? "light" : "dark");
          });
          applyTheme(document.documentElement.getAttribute("data-theme") || "light");
        }

        document.querySelectorAll(".sidebar a").forEach((a) => {
          const active = a.getAttribute("href") === ("reader.html?doc=" + doc);
          a.classList.toggle("active", active);
        });

        try {
          const embedded = window.DOCS_EMBEDDED && window.DOCS_EMBEDDED[doc];
          if (typeof embedded === "string") {
            content.innerHTML = "<div class=\"doc-title-chip\">Markdown Reader</div>" + renderMarkdown(embedded);
            return;
          }
          const res = await fetch(doc, { cache: "no-cache" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const md = await res.text();
          content.innerHTML = "<div class=\"doc-title-chip\">Markdown Reader</div>" + renderMarkdown(md);
        } catch (err) {
          content.innerHTML = "<div class=\"error\">Failed to load <code>" + doc + "</code>: " + escapeHtml(String(err)) + "</div>";
        }
      }
      initTheme();
      initMobileSidebar();
      loadDoc();
    </script>
  </body>
</html>
