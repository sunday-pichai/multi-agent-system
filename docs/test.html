<!DOCTYPE html>
<html>
<head>
    <title>Canvas Test</title>
    <style>
        body { background: #1a1a1a; color: #fff; padding: 20px; }
        canvas { border: 1px solid #666; background: #0f1318; display: block; margin: 20px 0; }
        .status { margin: 10px 0; padding: 10px; background: #333; }
    </style>
</head>
<body>
    <h1>Canvas Test</h1>
    <div class="status" id="status">Loading...</div>
    
    <h2>Algo Canvas</h2>
    <button data-algo="astar">A*</button>
    <button data-algo="cbs">CBS</button>
    <canvas id="algoCanvas" width="650" height="380"></canvas>
    <p id="algoCaption">Caption</p>
    
    <h2>Symmetry Canvas</h2>
    <button data-algo="symmetry">Symmetry</button>
    <button data-algo="quotient">Quotient</button>
    <canvas id="symmetryCanvas" width="650" height="380"></canvas>
    <p id="symmetryCaption">Caption</p>
    
    <h2>Verify Canvas</h2>
    <button data-algo="verification">Verification</button>
    <button data-algo="refinement">Refinement</button>
    <canvas id="verifyCanvas" width="650" height="380"></canvas>
    <p id="verifyCaption">Caption</p>
    
    <script>
        const status = document.getElementById('status');
        const algoCanvas = document.getElementById('algoCanvas');
        const symmetryCanvas = document.getElementById('symmetryCanvas');
        const verifyCanvas = document.getElementById('verifyCanvas');
        
        status.innerHTML = `
            algoCanvas: ${algoCanvas ? '✓ Found' : '✗ Not found'}<br>
            symmetryCanvas: ${symmetryCanvas ? '✓ Found' : '✗ Not found'}<br>
            verifyCanvas: ${verifyCanvas ? '✓ Found' : '✗ Not found'}
        `;
        
        if (algoCanvas) {
            const ctx = algoCanvas.getContext('2d');
            ctx.fillStyle = '#66bb6a';
            ctx.fillRect(50, 50, 100, 100);
            ctx.fillStyle = '#fff';
            ctx.font = '20px monospace';
            ctx.fillText('Algo Canvas Works!', 170, 105);
        }
        
        if (symmetryCanvas) {
            const ctx = symmetryCanvas.getContext('2d');
            ctx.fillStyle = '#4fc3f7';
            ctx.fillRect(50, 50, 100, 100);
            ctx.fillStyle = '#fff';
            ctx.font = '20px monospace';
            ctx.fillText('Symmetry Canvas Works!', 170, 105);
        }
        
        if (verifyCanvas) {
            const ctx = verifyCanvas.getContext('2d');
            ctx.fillStyle = '#f08c3a';
            ctx.fillRect(50, 50, 100, 100);
            ctx.fillStyle = '#fff';
            ctx.font = '20px monospace';
            ctx.fillText('Verify Canvas Works!', 170, 105);
        }
    </script>
</body>
</html>
