# Configuration for Warehouse MAS project
# Override defaults from config.py

grid:
  width: 20
  height: 20
  cell_size: 30

agents:
  num_agents: 8
  num_shelves: 20
  goals:
    - [9, 18]
    - [10, 18]

training:
  lr: 0.0005
  gamma: 0.99
  batch_size: 128
  target_update: 500
  memory_size: 100000
  warmup_steps: 5000
  save_interval: 20000
  eps_start: 1.0
  eps_end: 0.1  # Keep more exploration
  eps_decay: 0.99997  # Slower decay for better exploration

paths:
  model_dir: models
