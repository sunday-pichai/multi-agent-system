# Configuration for Warehouse MAS project
# Override defaults from config.py

grid:
  width: 16
  height: 16
  cell_size: 30

agents:
  num_agents: 2
  num_shelves: 8
  goals:
    - [7, 14]
    - [8, 14]

planning:
  horizon: 30
  astar_max_nodes: 3500
  idle_limit: 4

render:
  fps: 2
  astar_visualization: true

verification:
  min_separation: 1
  horizon: 30
  trials: 20

refinement:
  iterations: 2
  max_constraints: 100

paths:
  model_dir: models
